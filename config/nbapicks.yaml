# NBA Picks settings. Edit, commit, push: the next scheduled run uses them.
# Every change to this file is visible in git history (the settings audit trail).

timezone: America/Toronto        # slate dates and Discord times

stakes:                          # units only; never escalated automatically
  straight: 1.0
  parlay: 1.0                  # owner 2026-10-27: parlays and the lotto are staked 1 unit, paid at the stated price
  lotto: 1.0

targets:                         # maxima, never quotas
  straight: 5                  # owner spec 2026-10-22: up to five straights
  parlay: 2                    # owner 2026-10-27: always 2 parlays and 1 lotto a day (highest win chance), research only
  lotto: 1

markets:                         # status: research | paper | live (set by promotion decisions)
  ml:     {enabled: true, status: research, min_ev: 0.03}
  spread: {enabled: true, status: research, min_ev: 0.03}
  total:  {enabled: true, status: research, min_ev: 0.03}
  prop:   {enabled: true, status: research, min_ev: 0.05}
  parlay: {enabled: true, status: research, min_ev: 0.05, max_legs: 3}
  lotto:  {enabled: true, status: research, min_ev: 0.10, min_decimal: 8.0, max_legs: 5}

leans:                           # the daily posted picks (nbapicks/leans.py); fixed rule, never tuned on results
  # Rule of 2026-11-17 (data/research/decisions.jsonl): a pick is a FanDuel prop whose price beats the
  # fair price (DraftKings two-way price, margin removed) by markets.prop.min_ev. Ranked by that edge.
  model_weight: 0.0              # weight of the prop model in the fair chance; 0 until a model passes config/gates.yaml
  min_decimal: 1.5               # FanDuel price of at least -200: a loss never costs more than two wins
  max_leans: 6
  per_game: 1                    # one straight pick per game (2 until 2026-11-17)
  pool_min_edge: 0.025           # parlay and lotto legs: at least half the pick threshold (the "watch" level)
  tickets_require_edge: true     # parlays/lotto only when their combined edge clears markets.parlay/lotto min_ev;
                                 # false restores the 2026-10-27 always-post rule (highest win chance, any edge)
  fd_markets: [pts, reb, ast, fg3m]   # order the odds feed is asked in; one credit per market per game
  fd_credits_per_slate: 12       # The Odds API free tier is 500 credits a month (about 16 a day)
  fd_refresh_credits: 4          # pre-tip re-checks of posted picks

quality:
  max_odds_age_minutes: 120      # older quotes cannot qualify
  min_minutes_before_tip: 20     # too close to tip: hold
  max_model_market_gap: 0.10     # |model - de-vigged market| above this is held as a likely model error
  max_ev: 0.15                   # implausibly large edges are held for review
  key_player_min_minutes: 24     # recent average that makes a player 'key'
  unresolved_statuses: [Questionable, Doubtful, Day-To-Day, Game Time Decision, GTD, Probable]
  max_line_disagreement: 1.5     # points between books before a line is 'inconsistent'
  max_injury_age_minutes: 240    # props need an injury report this fresh (added 2026-10-22, tightening)

risk:
  max_units_per_game: 2.0
  max_units_per_day: 8.0
  max_parlay_units_per_day: 2.0
  max_lotto_units_per_day: 1.0
  max_same_team_exposures: 1     # straight picks on the same side of one game (e.g. ML and spread)
  max_props_per_player: 1        # one straight per player per day: his props are correlated (added 2026-10-22)
  max_props_per_game: 2          # props in one game share pace and blowout risk (added 2026-10-22)

execution:
  book: FanDuel                  # where bets are placed, manually
  # No free, permitted FanDuel Ontario feed was found (see docs/sources.yaml).
  # Picks therefore carry a reference price from another book and the minimum
  # FanDuel price at which the edge still clears the threshold.
  reference_books: [DraftKings, bet365]

publishing:
  dry_run: true                  # true: build and log messages, send nothing
  webhook_secret: NBA_DISCORD_WEBHOOK_URL   # name of the GitHub secret, never the URL
  publish_paper: true            # paper-status markets post, clearly labelled PAPER
  max_prediction_age_minutes: 60 # publish only from a prediction run this recent (predict runs just before)
  research_watchlist: false      # near-misses in the recap, labelled research-only
