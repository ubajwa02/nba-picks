name: nba-backup
# A downloadable copy of the whole repo (all branches and history), on demand only.
# Picks, predictions and results are already committed to git under data/ledger, so this
# bundle is a spare copy. It used to run after every data run (~110 MB each), which filled
# the account's Actions artifact storage and blocked the trading bots' log uploads.
on:
  workflow_dispatch:
concurrency:
  group: nba-backup
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Bundle
        run: |
          git bundle create nba-picks.bundle --all
          git bundle verify nba-picks.bundle
          echo "commit: $(git rev-parse HEAD)" > nba-picks.bundle.txt
          git rev-list --count HEAD >> nba-picks.bundle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nba-picks-bundle
          path: |
            nba-picks.bundle
            nba-picks.bundle.txt
          retention-days: 1
          compression-level: 0
