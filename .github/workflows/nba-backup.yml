name: nba-backup
# A downloadable copy of the whole repo (all branches and history): on every human push to main, and once a day.
# Bot commits do not trigger push workflows, so the data runs are covered by the daily slot. It used to run after every
# nba-daily/backfill/research/backtest run (workflow_run), which doubled the Actions minutes of every cron slot.
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 14 * * *"   # ~09:15-10:15 ET, after the overnight results and the 13:00 UTC catch-up
  workflow_dispatch:
concurrency:
  group: nba-backup
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - name: Bundle
        run: |
          git bundle create nba-picks.bundle --all
          git bundle verify nba-picks.bundle
          echo "commit: $(git rev-parse HEAD)" > nba-picks.bundle.txt
          git rev-list --count HEAD >> nba-picks.bundle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nba-picks-bundle
          path: |
            nba-picks.bundle
            nba-picks.bundle.txt
          retention-days: 90
          compression-level: 0
