name: nba-daily
# The NBA Picks day: ingest, predict, publish (once), settle, recap, diagnose, export.
# Every predict run records each candidate; a changed price/line/injury picture writes a new
# version (never an overwrite). A failed ingest skips predict/publish and fails the job after
# committing what it has, so a stale run is never reported as a good one.
# Times are UTC. Publishing is dry-run until config/nbapicks.yaml says otherwise.
on:
  schedule:
    - cron: "0 15 * * 1-5"  # ~11:00 ET  morning read: ingest + predict (weekdays)
    # Picks slots: 4:30 PM ET weekdays, 11:00 AM ET weekends. Cron is UTC and ignores daylight saving, so
    # each slot is listed for both offsets (EDT before Nov 1 2026, EST after) and the "Choose steps" step
    # only posts picks once the New York clock has reached the target time. The +20/+50 minute slots are
    # backups: GitHub delays or drops cron runs, and posting is once per slate.
    - cron: "30 20 * * 1-5"   # 16:30 EDT
    - cron: "50 20 * * 1-5"
    - cron: "20 21 * * 1-5"
    - cron: "30 21 * * 1-5"   # 16:30 EST
    - cron: "50 21 * * 1-5"
    - cron: "20 22 * * 1-5"
    - cron: "0 15 * * 0,6"    # 11:00 EDT
    - cron: "20 15 * * 0,6"
    - cron: "50 15 * * 0,6"
    - cron: "0 16 * * 0,6"    # 11:00 EST
    - cron: "20 16 * * 0,6"
    - cron: "50 16 * * 0,6"
    - cron: "30 22 * * *"   # ~18:30 ET  pre-tip refresh before 7pm tips: injuries/lineups/prices (no publish)
    - cron: "15 23 * * *"   # ~19:15 ET  pre-tip refresh for later tips (no publish)
    - cron: "30 3 * * *"    # 23:30 EDT  evening grading: early games and bets that are already final
    - cron: "30 4 * * *"    # 23:30 EST  same slot after the Nov 1 clock change (grading is idempotent)
    - cron: "0 7 * * *"     # ~03:00 ET  results: settle + recap (late West Coast games)
    - cron: "40 8 * * *"    # backup results slot (settling is idempotent)
    - cron: "0 13 * * *"    # ~09:00 ET  late results catch-up
  push:
    branches: [main]
    paths: [ops/trigger]
  workflow_dispatch:
    inputs:
      steps:
        description: "steps to run (ingest predict publish settle recap export | all)"
        default: "ingest predict settle export"
permissions:
  contents: write
concurrency:
  group: nba-state           # one writer at a time. GitHub keeps one pending run per group: a newer
                             # queued run replaces an older pending one (the next scheduled run catches up)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # a queued run must not reuse a stale commit's state
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Choose steps
        id: steps
        env:
          SCHED: ${{ github.event.schedule }}
          INPUT: ${{ inputs.steps }}
        run: |
          # New York clock: picks go out at 16:30 on weekdays, 11:00 on weekends, never earlier.
          DOW=$(TZ=America/New_York date +%u); MIN=$(( 10#$(TZ=America/New_York date +%H) * 60 + 10#$(TZ=America/New_York date +%M) ))
          if [ "$DOW" -ge 6 ]; then TARGET=660; else TARGET=990; fi
          PICKS="ingest catchup predict publish leans settle export"
          if [ "$MIN" -lt "$TARGET" ]; then PICKS="ingest catchup predict settle export"; fi
          case "$SCHED" in
            "30 20 * * 1-5"|"50 20 * * 1-5"|"20 21 * * 1-5"|"30 21 * * 1-5"|"50 21 * * 1-5"|"20 22 * * 1-5"|\
            "0 15 * * 0,6"|"20 15 * * 0,6"|"50 15 * * 0,6"|"0 16 * * 0,6"|"20 16 * * 0,6"|"50 16 * * 0,6") S="$PICKS" ;;
            "30 3 * * *"|"30 4 * * *"|"0 7 * * *"|"40 8 * * *"|"0 13 * * *") S="ingest catchup settle recap diagnose export" ;;
            "") S="${INPUT:-ingest catchup predict settle export}" ;;
            *) S="ingest catchup predict settle export" ;;
          esac
          if [ -f ops/trigger ] && [ -z "$SCHED" ] && [ -z "$INPUT" ]; then S="$(head -1 ops/trigger)"; fi
          echo "steps=$S" >> "$GITHUB_OUTPUT"; echo "steps: $S"
      - name: Run
        id: run
        env:
          NBA_DISCORD_WEBHOOK_URL: ${{ secrets.NBA_DISCORD_WEBHOOK_URL }}
          STEPS: ${{ steps.steps.outputs.steps }}
        run: |
          set +e
          python -m nbapicks.pipeline $STEPS 2>&1 | tee /tmp/run.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit ledger and dashboard data
        if: always()
        env:
          STEPS: ${{ steps.steps.outputs.steps }}
        run: |
          ops/commit_changed.sh "nba: $STEPS" data/ledger data/state data/ref data/research reports site
      - name: Fail if a step failed
        if: steps.run.outputs.code != '0'
        run: tail -n 60 /tmp/run.log; exit 1
