name: nba-research
# Weekly improvement cycle (python -m nbapicks.weekly): live diagnostics, queued game-market
# challengers, prop-model challengers on the pre-registered validate window, forward demotion
# check, report and dashboard export. Never promotes on its own: promotion needs the gates in
# config/gates.yaml plus an independent review (python -m nbapicks.weekly --promote ... --review ...).
on:
  schedule:
    - cron: "0 10 * * 1"     # Mondays ~06:00 ET
  workflow_dispatch:
    inputs:
      skip_games:
        description: "skip game-market challengers (yes/no)"
        default: "no"
permissions:
  contents: write
concurrency:
  group: nba-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nba-cache-${{ hashFiles('data/history/*.csv.gz') }}
          restore-keys: nba-cache-
      - name: Weekly cycle
        id: run
        env:
          SKIP: ${{ inputs.skip_games }}
        run: |
          set +e
          ARGS=""
          if [ "$SKIP" = "yes" ]; then ARGS="--skip-games"; fi
          timeout 80m python -m nbapicks.weekly $ARGS 2>&1 | tee /tmp/weekly.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: always()
        run: |
          ops/commit_changed.sh "research: weekly cycle" data/research data/state reports site
      - name: Fail if the cycle failed
        if: steps.run.outputs.code != '0'
        run: tail -n 60 /tmp/weekly.log; exit 1
