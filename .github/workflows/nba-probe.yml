name: probe-sources
# Checks which free data sources answer from a GitHub runner; commits the evidence.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nba-state
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/capture_fixtures.py
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/probe_fixtures
          git commit -m "probe: source evidence [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i*5)); done
          exit 1
