<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar with view tabs; each view is a column of panels on a 12-col grid that collapses to one column on phones.
   Tables scroll inside .tablewrap so the page itself never scrolls sideways. */
:root {
  --bg: #0b0f12; --panel: #12181d; --panel-2: #182027; --line: #243039; --fg: #dbe4ea; --muted: #8394a1;
  --pos: #39e58c; --neg: #ff5c6c; --warn: #f2b84b; --info: #6cb6ff; --paper: #c49bff;
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { overflow-x: hidden; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 12px; }
.brand { font: 700 22px/1 var(--display); letter-spacing: .02em; display: flex; align-items: center; gap: 10px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 10px var(--pos); }
.brand i.stale { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
nav { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: none; }
nav a { color: var(--muted); text-decoration: none; font: 600 14px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 6px 10px; border-radius: 6px; white-space: nowrap; }
nav a[aria-current="true"] { color: var(--fg); background: var(--panel-2); }
nav a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.meta { font: 12px var(--mono); color: var(--muted); }
h2 { font: 700 26px/1.1 var(--display); margin: 28px 0 4px; text-wrap: balance; letter-spacing: .01em; }
h3 { font: 600 15px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
h4 { font: 600 17px var(--display); margin: 18px 0 8px; letter-spacing: .02em; }
.sub { color: var(--muted); margin: 0 0 16px; max-width: 80ch; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.s2 { grid-column: span 2 } .s3 { grid-column: span 3 } .s4 { grid-column: span 4 } .s6 { grid-column: span 6 } .s8 { grid-column: span 8 } .s12 { grid-column: span 12 }
@media (max-width: 900px) { .s2 { grid-column: span 4 } .s3, .s4 { grid-column: span 6 } .s6, .s8 { grid-column: span 12 } }
@media (max-width: 560px) { .s2 { grid-column: span 6 } .s3, .s4, .s6, .s8 { grid-column: span 12 } }
.kpi .v { font: 700 30px/1 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .l { font-size: 13px; color: var(--muted); margin-top: 6px; }
details.more { margin-block: 12px } details.more > summary { cursor: pointer; color: var(--fg); padding-block: 8px; font: 600 16px var(--display); letter-spacing: .02em; }
.pos { color: var(--pos) } .neg { color: var(--neg) } .warn { color: var(--warn) } .mut { color: var(--muted) }
.pill { display: inline-block; font: 600 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.p-eligible, .p-ok, .p-live, .p-sent, .p-completed, .p-done, .p-win, .p-final { color: var(--pos) }
.p-watch, .p-paper, .p-dry_run, .p-in_progress, .p-review { color: var(--paper) }
.p-hold, .p-research, .p-blocked, .p-todo, .p-stale { color: var(--warn) }
.p-reject, .p-failed, .p-fail, .p-loss { color: var(--neg) }
.p-pending, .p-push, .p-void, .p-scheduled, .p-info, .p-cashout { color: var(--muted) }
.tag { display: inline-block; font: 11px/1.4 var(--mono); color: var(--warn); border: 1px dashed var(--warn); border-radius: 4px; padding: 0 5px; margin-left: 4px; white-space: nowrap; }
.tablewrap { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font: 600 12px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:hover td { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.reason { color: var(--muted); font-size: 13px; max-width: 60ch; }
.who { color: var(--muted); font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
select, input[type=search], input[type=number] { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 14px var(--body); min-width: 0; max-width: 100%; }
input[type=number] { width: 5em; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; color: var(--muted); border: 0; padding: 6px 12px; font: 600 13px var(--display); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }
.empty { color: var(--muted); padding: 18px; border: 1px dashed var(--line); border-radius: 8px; text-align: center; margin: 0; }
.banner { border: 1px solid var(--warn); color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 8px; padding: 10px 14px; margin-top: 16px; font-size: 14px; }
.banner.bad { border-color: var(--neg); color: var(--neg); background: color-mix(in srgb, var(--neg) 8%, transparent); }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.note { border-left: 3px solid var(--info); padding: 6px 12px; color: var(--fg); background: color-mix(in srgb, var(--info) 6%, transparent); border-radius: 0 6px 6px 0; margin: 10px 0; font-size: 14px; }
.list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.game { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.game .tip { font: 12px var(--mono); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.game .teams { font: 700 22px/1.2 var(--display); margin: 8px 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.game .teams .sc { font-family: var(--mono); font-size: 18px; text-align: right; }
.game .foot { font-size: 13px; color: var(--muted); }
details.why > summary { cursor: pointer; color: var(--info); font-size: 13px; margin-top: 4px; }
details.why dl { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr); gap: 2px 12px; margin: 8px 0; font-size: 13px; }
details.why dt { color: var(--muted); } details.why dd { margin: 0; overflow-wrap: anywhere; }
.na { color: var(--muted); font-style: italic; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 var(--mono); color: var(--fg); background: var(--panel-2); padding: 12px; border-radius: 8px; max-height: 480px; overflow: auto; }
dl.help { display: grid; grid-template-columns: minmax(140px, max-content) minmax(0, 1fr); gap: 8px 16px; margin: 0; }
dl.help dt { font-weight: 600; } dl.help dd { margin: 0; color: var(--muted); }
@media (max-width: 560px) { dl.help, details.why dl { grid-template-columns: 1fr; } }
.player { margin-bottom: 14px; }
.player .ph { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; align-items: baseline; margin-bottom: 8px; }
.player .ph b { font: 700 19px var(--display); }
code { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .panel { transition: border-color .15s } .panel:hover { border-color: #31414d } }

/* day blocks, win-chance bars, games */
nav a[href="#settings"] { margin-left: auto }
.day { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 16px 0; overflow: hidden; }
.dayh { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 14px 16px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.dayh h3 { margin: 0; color: var(--fg); text-transform: none; letter-spacing: .01em; font: 700 20px var(--display); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: flex; flex-direction: column; min-width: 78px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.chip span { font: 600 11px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chip b { font: 700 18px var(--display); font-variant-numeric: tabular-nums; }
.day .tablewrap { padding: 4px 8px 8px; }
.wc { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.wc b { font: 600 14px var(--mono); min-width: 3ch; text-align: right; }
.meter { width: 56px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--info); }
.game .side { display: grid; grid-template-columns: 1fr auto 3.5ch; gap: 8px; align-items: baseline; margin-top: 8px; }
.game .tm { font: 700 22px/1.2 var(--display); }
.game .sc { font: 18px var(--mono); text-align: right; }
.game .pr { font: 700 18px var(--mono); text-align: right; color: var(--muted); }
.game .pr.pos { color: var(--pos); }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
@media (max-width: 560px) { .players { grid-template-columns: minmax(0, 1fr); } }
a { color: var(--info); }
</style>

<header><div class="wrap bar">
  <div class="brand"><i aria-hidden="true" id="dot"></i>NBA Picks</div>
  <nav id="nav" aria-label="Views"></nav>
  <div class="meta" id="stamp"></div>
</div></header>
<main class="wrap" id="app"><p class="empty">Loading dashboard data…</p></main>
<script id="embedded" type="application/json"></script>
<script>
"use strict";
const VIEWS = [["today","Today"],["picks","Picks"],["performance","Performance"],["parlays","Parlays"],["lottos","Lottos"],["players","Players"],["settings","Settings & Audit"]];
const STAT = {pts:"Points", reb:"Rebounds", ast:"Assists", fg3m:"3-Pointers Made", stl:"Steals", blk:"Blocks"};
const RES = {win:"✓ Win", loss:"✗ Loss", push:"= Push", void:"Void", pending:"Pending", cashout:"Cash-out"};
let D = null;
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d=0) => x == null ? "–" : (x*100).toFixed(d) + "%";
const spct = (x, d=1) => x == null ? "–" : (x>=0?"+":"") + (x*100).toFixed(d) + "%";
const u = x => x == null ? "–" : (x>=0?"+":"") + Number(x).toFixed(2) + "u";
const cls = x => x == null ? "mut" : x > 0 ? "pos" : x < 0 ? "neg" : "mut";
const amS = a => a == null ? "–" : (a > 0 ? "+" : "") + a;
const pill = (s, label) => `<span class="pill p-${esc(s)}">${esc(label ?? s)}</span>`;
const resPill = r => pill(r || "pending", RES[r || "pending"] || r);
const toDate = iso => { const s = String(iso); return new Date(/([zZ]|[+-]\d\d:\d\d)$/.test(s) ? s : s + "Z"); };
const time = iso => { if (!iso) return "–"; const t = toDate(iso); return isNaN(t) ? String(iso) : t.toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}); };
const tip = iso => { if (!iso) return "–"; const t = toDate(iso); return isNaN(t) ? String(iso) : t.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); };
const longDay = ymd => new Date(ymd + "T12:00:00").toLocaleDateString([], {weekday:"long", month:"long", day:"numeric", year:"numeric"});
const tbl = (head, rows, empty) => rows.length ? `<div class="tablewrap"><table><thead><tr>${head.map(h => `<th${h.startsWith("#") ? ' class="n"' : ""}>${esc(h.replace(/^#/, ""))}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>` : `<p class="empty">${esc(empty || "Nothing to show.")}</p>`;
const kv = o => tbl(["Setting", "#Value"], Object.entries(o || {}).map(([k,v]) => `<tr><td>${esc(title(k))}</td><td class="n">${esc(typeof v === "object" && v !== null ? JSON.stringify(v) : v)}</td></tr>`), "Not set.");
const title = s => String(s).replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());

/* ---- pick wording: full words, capital O/U ---- */
function legText(label) {
  let m = /^(.*?) ([ou])(\d+(?:\.\d+)?) (\w+)$/.exec(label);
  if (m) return `${m[1]} · ${m[2].toUpperCase()} ${m[3]} ${STAT[m[4]] || m[4]}`;
  m = /^(\S+) ([ou])(\d+(?:\.\d+)?)$/.exec(label);
  if (m) return `${m[1]} · ${m[2].toUpperCase()} ${m[3]} Total Points`;
  m = /^(\S+) ML$/.exec(label);
  if (m) return `${m[1]} Moneyline`;
  m = /^(\S+) ([+-]\d+(?:\.\d+)?)$/.exec(label);
  if (m) return `${m[1]} ${m[2]} Spread`;
  return label;
}
function pickText(r) {
  const l = String(r.label || r.market || "");
  const m = /^(parlay|lotto): (.*)$/i.exec(l);
  if (m) return `${m[1][0].toUpperCase() + m[1].slice(1).toLowerCase()}: ` + m[2].split(" + ").map(legText).join(" + ");
  return legText(l);
}
const bar = p => `<span class="wc"><b>${pct(p)}</b><span class="meter"><i style="width:${Math.max(0, Math.min(100, (p || 0) * 100))}%"></i></span></span>`;
const finalText = r => r.result === "pending" || !r.result ? "" : r.market === "prop" ? (r.stat_value ?? "–") : (r.score || "");
const pickRow = r => `<tr><td><b>${esc(pickText(r))}</b></td><td class="n">${bar(r.prob)}</td><td class="n">${amS(r.price_american)}</td><td class="meta">${esc(finalText(r))}</td><td>${resPill(r.result)}</td><td class="n ${cls(r.net_units)}">${r.net_units == null ? "–" : u(r.net_units)}</td></tr>`;
const pickTable = (rows, empty) => tbl(["Pick", "#Win Chance", "#Price", "Final", "Result", "#Units"], rows.map(pickRow), empty);

const allPicks = () => ((D.performance.posted_leans || {}).rows || []).slice().sort((a, b) => String(b.slate).localeCompare(String(a.slate)));
const todayStr = () => (D.today || {}).date || D.meta.today;
const todayPicks = () => ((D.today || {}).leans || []).map(r => ({...r, slate: r.slate || todayStr()}));
const NO_PICKS = `<p class="note">Today's picks will be posted at 4:30 PM ET, when the system runs.</p>`;

function dayStats(rows) {
  const done = rows.filter(r => r.result === "win" || r.result === "loss");
  const w = done.filter(r => r.result === "win").length, l = done.length - w;
  const net = rows.reduce((a, r) => a + (r.net_units || 0), 0);
  return {w, l, n: done.length, net, rate: done.length ? w / done.length : null, pending: rows.length - done.filter(Boolean).length - rows.filter(r => r.result && r.result !== "pending" && r.result !== "win" && r.result !== "loss").length};
}
const chip = (label, value, c) => `<div class="chip"><span>${label}</span><b class="${c || ""}">${value}</b></div>`;
function dayBlock(date, rows, isToday) {
  const s = dayStats(rows);
  return `<section class="day"><header class="dayh"><h3>${isToday ? "Today · " : ""}${esc(longDay(date))}</h3>
    <div class="chips">${chip("Record", s.n ? `${s.w}-${s.l}` : "–")}${chip("Win Rate", s.n ? pct(s.rate) : "–")}${chip("Net Units", s.n ? u(s.net) : "–", s.n ? cls(s.net) : "")}${chip("Picks", rows.length)}</div></header>
    ${pickTable(rows, "No picks posted.")}</section>`;
}

/* ---- games with the model's win chance for each side ---- */
function gameChances() {
  const m = {};
  for (const r of (D.valuation || {}).rows || []) if (r.market === "ml" && r.team && r.prob != null) (m[r.matchup] = m[r.matchup] || {})[r.team] = r.prob;
  return m;
}
function gameCards() {
  const games = (D.today || {}).games || [], ch = gameChances();
  if (!games.length) return `<p class="empty">No games on today's slate.</p>`;
  return `<div class="games">${games.map(g => {
    const c = ch[`${g.away} @ ${g.home}`] || {};
    let a = c[g.away], h = c[g.home];
    if (a == null && h != null) a = 1 - h; if (h == null && a != null) h = 1 - a;
    const live = g.status !== "scheduled", st = g.status === "final" ? "Final" : g.status === "scheduled" ? "Scheduled" : "Live";
    const side = (t, p, sc) => `<div class="side"><span class="tm">${esc(t)}</span><span class="sc">${live && sc != null ? esc(sc) : ""}</span><span class="pr ${p != null && p >= 0.5 ? "pos" : ""}">${p == null ? "–" : pct(p)}</span></div>`;
    return `<div class="game"><div class="tip"><span>${tip(g.start_utc)}</span>${pill(st.toLowerCase(), st)}</div>${side(g.away, a, g.away_score)}${side(g.home, h, g.home_score)}<div class="foot">Model win chance</div></div>`; }).join("")}</div>`;
}

function banner() {
  const m = D.meta || {}, w = (m.warnings || []).filter(x => !/discord/i.test(x));
  const parts = [];
  if (m.paused) parts.push(`New recommendations are paused: ${esc(m.paused.reason || "")}`);
  w.forEach(x => parts.push(esc(x)));
  return parts.length ? `<div class="banner ${m.paused ? "bad" : ""}"><ul>${parts.map(p => `<li>${p}</li>`).join("")}</ul></div>` : "";
}

const R = {};
R.today = () => {
  const T = D.today || {}, picks = todayPicks(), n = T.game_count || (T.games || []).length;
  const recent = allPicks().filter(r => r.slate !== todayStr()).slice(0, 10);
  return `${banner()}
  <h2>Today · ${esc(longDay(todayStr()))}</h2>
  <p class="sub">${n} ${n === 1 ? "Game" : "Games"} Scheduled · Updated ${time(D.meta.generated_at)}</p>
  <h2>Games</h2>${gameCards()}
  <h2>Today's Picks</h2>
  ${picks.length ? `<div class="panel">${pickTable(picks, "")}</div>` : NO_PICKS}
  ${picks.length ? "" : `<h2>Latest Picks</h2><div class="panel">${pickTable(recent, "No picks yet.")}</div><p class="sub"><a href="#picks">All Picks By Day</a></p>`}`;
};
R.picks = () => {
  const rows = allPicks(), today = todayStr(), tp = todayPicks();
  const days = [...new Set(rows.map(r => r.slate).filter(d => d !== today))].sort().reverse();
  return `${banner()}<h2>Today's Picks</h2>
  ${tp.length ? dayBlock(today, tp, true) : NO_PICKS}
  ${days.map(d => dayBlock(d, rows.filter(r => r.slate === d), false)).join("")}`;
};
R.performance = () => {
  const rows = allPicks(), s = dayStats(rows), B = D.performance.posted_leans || {};
  return `${banner()}<h2>Performance</h2><p class="sub">Stake: 1 Unit Each</p>
  <div class="grid">
    <div class="panel kpi s3"><div class="v">${B.wins ?? s.w}-${B.losses ?? s.l}</div><div class="l">Record</div></div>
    <div class="panel kpi s3"><div class="v">${pct(B.hit_rate ?? s.rate)}</div><div class="l">Hit Rate</div></div>
    <div class="panel kpi s3"><div class="v ${cls(B.net_units)}">${u(B.net_units ?? s.net)}</div><div class="l">Net Units</div></div>
    <div class="panel kpi s3"><div class="v ${cls(B.roi)}">${spct(B.roi)}</div><div class="l">ROI</div></div>
  </div>
  <h2>All Picks</h2>
  <div class="panel">${tbl(["Date", "Pick", "#Win Chance", "#Price", "Final", "Result", "#Units"], rows.map(r => `<tr><td class="n">${esc(r.slate)}</td><td><b>${esc(pickText(r))}</b></td><td class="n">${bar(r.prob)}</td><td class="n">${amS(r.price_american)}</td><td class="meta">${esc(finalText(r))}</td><td>${resPill(r.result)}</td><td class="n ${cls(r.net_units)}">${r.net_units == null ? "–" : u(r.net_units)}</td></tr>`), "No picks yet.")}</div>`;
};

/* ---- parlays and lottos (research) ---- */
function ticketRows(kind) { return (((D.tickets || {}).rows) || []).filter(t => t.kind === kind); }
function ticketCard(t) {
  return `<div class="panel"><div class="ph"><b>${t.legs.length}-Leg ${kind1(t.kind)}</b><span class="meta">Win Chance ${pct(t.prob)} · Pays ${amS(t.price_american)} · ${resPill(t.result)} · ${t.net_units == null ? "–" : u(t.net_units)}</span></div>
    ${tbl(["Leg", "#Win Chance", "#Price", "Result"], t.legs.map(l => `<tr><td><b>${esc(pickText(l))}</b></td><td class="n">${bar(l.prob)}</td><td class="n">${amS(l.price_american)}</td><td>${resPill(l.result)}</td></tr>`), "")}</div>`;
}
const kind1 = k => k === "lotto" ? "Lotto" : "Parlay";
function ticketDay(date, rows, isToday, notes) {
  const s = dayStats(rows);
  return `<section class="day"><header class="dayh"><h3>${isToday ? "Today · " : ""}${esc(longDay(date))}</h3>
    <div class="chips">${chip("Record", s.n ? `${s.w}-${s.l}` : "–")}${chip("Win Rate", s.n ? pct(s.rate) : "–")}${chip("Net Units", s.n ? u(s.net) : "–", s.n ? cls(s.net) : "")}${chip("Tickets", rows.length)}</div></header>
    ${rows.length ? rows.map(ticketCard).join("") : `<p class="empty">${isToday && !(notes && notes.length) ? "Not posted yet. Tickets are built from the day's picks at 4:30 PM ET." : "None posted."}</p>`}
    ${(notes || []).map(n => `<p class="sub">${esc(n)}</p>`).join("")}</section>`;
}
function ticketView(kind, label, plural) {
  const rows = ticketRows(kind), notes = ((D.tickets || {}).notes) || {}, s = dayStats(rows), today = todayStr();
  const days = [...new Set([today, ...rows.map(r => r.slate)])].sort().reverse();
  return `${banner()}<h2>${plural}</h2><p class="sub">Research Only · Stake: 1 Unit Each · Posted With Today's Picks · Fewer Are Posted When Too Few Qualify</p>
  <div class="grid">
    <div class="panel kpi s3"><div class="v">${s.n ? `${s.w}-${s.l}` : "–"}</div><div class="l">Record</div></div>
    <div class="panel kpi s3"><div class="v">${s.n ? pct(s.rate) : "–"}</div><div class="l">Hit Rate</div></div>
    <div class="panel kpi s3"><div class="v ${cls(s.net)}">${s.n ? u(s.net) : "–"}</div><div class="l">Net Units</div></div>
    <div class="panel kpi s3"><div class="v">${rows.length}</div><div class="l">Tickets Posted</div></div>
  </div>
  ${days.map(d => ticketDay(d, rows.filter(r => r.slate === d), d === today, ((notes[d] || []).filter(n => kind === "lotto" ? /lotto/i.test(n) : !/lotto/i.test(n))))).join("")}`;
}
R.parlays = () => ticketView("parlay", "Parlay", "Parlays");
R.lottos = () => ticketView("lotto", "Lotto", "Lottos");
R.players = () => {
  const ids = new Set(((D.today || {}).games || []).map(g => String(g.game_id)));
  const ps = ((D.players || {}).players || []).filter(p => !ids.size || ids.has(String(p.game_id))).slice(0, 10);
  return `${banner()}<h2>Top Players Today</h2><p class="sub">The players with the most likely props today, with their three best. Early in the season these rest on small samples.</p>
  ${ps.length ? `<div class="players">${ps.map(p => `<div class="panel player"><div class="ph"><b>${esc(p.player)}</b><span class="meta">${esc(p.team)} vs ${esc(p.opponent)} · ${tip(p.start_utc)}</span></div>
    ${tbl(["Prop", "#Win Chance", "#Price", "#Last 10"], p.props.map(x => `<tr><td>${esc(String(x.side || "").charAt(0).toUpperCase())} ${esc(x.line)} ${esc(x.stat_label || STAT[x.stat] || x.stat)}</td><td class="n">${bar(x.prob)}</td><td class="n">${amS(x.price_american)}</td><td class="n">${x.line_hits_last10 ? `${x.line_hits_last10.h}/${x.line_hits_last10.n}` : "–"}</td></tr>`), "")}</div>`).join("")}</div>` : `<p class="empty">No props to show yet. They appear once today's lines are posted.</p>`}`;
};
R.settings = () => {
  const S = D.settings || {}, c = S.config || {}, T = S.team || {};
  const roles = Array.isArray(T.roles) ? T.roles : [], health = Object.entries(S.source_health || {});
  return `${banner()}<h2>Settings & Audit</h2>
  <div class="grid">
    <div class="panel s4"><h3>Stakes (Units)</h3>${kv(c.stakes)}</div><div class="panel s4"><h3>Daily Maxima</h3>${kv(c.targets)}</div><div class="panel s4"><h3>Risk Limits</h3>${kv(c.risk)}</div>
    <div class="panel s12"><h3>Markets</h3>${tbl(["Market", "Status", "#Minimum EV", "Enabled"], Object.entries(c.markets || {}).map(([m, s]) => `<tr><td>${esc(title(m))}</td><td>${pill(s.status, title(s.status))}</td><td class="n">${pct(s.min_ev)}</td><td>${s.enabled ? "Yes" : "No"}</td></tr>`), "No markets.")}</div>
    <div class="panel s12"><h3>Source Health</h3>${tbl(["Source", "Status", "#Last OK", "Last Error"], health.map(([k, h]) => `<tr><td>${esc(k)}</td><td>${h.consecutive_failures ? pill("fail", h.consecutive_failures + " Failures") : pill("ok", "OK")}</td><td class="n">${time(h.last_ok)}</td><td class="reason">${esc(h.last_error_detail || "")}</td></tr>`), "No sources.")}</div>
    <div class="panel s12"><h3>Data Sources</h3>${tbl(["Source", "Use", "Status", "Coverage", "Limits"], (Array.isArray(S.sources) ? S.sources : []).map(x => `<tr><td>${esc(x.name)}</td><td class="reason">${esc(x.use)}</td><td>${pill(x.status === "in use" ? "ok" : "info", title(x.status || ""))}</td><td class="reason">${esc(x.coverage || "")}</td><td class="reason">${esc(x.limits || "")}</td></tr>`), "No sources listed.")}</div>
    <div class="panel s12"><h3>Team Roles</h3>${tbl(["Role", "Owns", "Executor"], roles.map(r => `<tr><td><b>${esc(r.name)}</b></td><td class="reason">${esc(r.owns)}</td><td class="reason">${esc(r.executor)}</td></tr>`), "No roles.")}</div>
  </div>`;
};

async function boot() {
  const emb = $("#embedded").textContent.trim();
  try { D = emb ? JSON.parse(emb) : await (await fetch("data.json", {cache: "no-store"})).json(); }
  catch (e) { $("#app").innerHTML = `<p class="empty">Could not load data.json (${esc(e.message)}).</p>`; return; }
  if (!D.meta) { $("#app").innerHTML = `<p class="empty">data.json is from an older exporter. Re-run the export step.</p>`; return; }
  $("#nav").innerHTML = VIEWS.map(([k,v]) => `<a href="#${k}" data-v="${k}">${v}</a>`).join("");
  $("#stamp").textContent = `Updated ${time(D.meta.generated_at)}`;
  if ((D.meta.warnings || []).length) $("#dot").classList.add("stale");
  window.addEventListener("hashchange", route); route();
}
function route() {
  const v = (location.hash || "#today").slice(1);
  const view = VIEWS.some(([k]) => k === v) ? v : "today";
  $$("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === view));
  try { $("#app").innerHTML = R[view](); }
  catch (e) { $("#app").innerHTML = `<p class="empty">This view could not be drawn (${esc(e.message)}).</p>`; console.error(e); }
  window.scrollTo(0, 0);
}
boot();
</script>
