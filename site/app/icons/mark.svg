  <rect x="9.9" y="9.5" width="4.2" height="11.5" rx="1.2" fill="currentColor"/>
  <rect x="15.8" y="5" width="4.2" height="16" rx="1.2" fill="currentColor"/>
  <circle cx="6.1" cy="6.2" r="2.6" fill="#FF7A1A"/>
</svg>
