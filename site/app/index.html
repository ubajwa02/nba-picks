<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0A09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NBA Picks">
<meta name="format-detection" content="telephone=no">
<title>NBA Picks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="icons/mark.svg">
<link rel="stylesheet" href="app.css">
<script>try { const t = localStorage.getItem("nba-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <a href="#tonight" class="brand-link" aria-label="NBA Picks, tonight"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="14" width="4.2" height="7" rx="1.2" fill="currentColor"/><rect x="9.9" y="9.5" width="4.2" height="11.5" rx="1.2" fill="currentColor"/><rect x="15.8" y="5" width="4.2" height="16" rx="1.2" fill="currentColor"/><circle cx="6.1" cy="6.2" r="2.6" fill="var(--accent)"/></svg><span class="brand-name">NBA Picks</span></a>
  <nav class="tabs" aria-label="Views">
    <a href="#tonight" data-view="tonight">Tonight</a>
    <a href="#games" data-view="games">Games</a>
    <a href="#record" data-view="record">Record</a>
    <a href="#players" data-view="players">Players</a>
    <a href="#more" data-view="more">More</a>
  </nav>
  <div class="status">
    <span class="meta" id="updated"><span class="live-dot" id="dot"></span> —</span>
    <button class="btn icon" id="refresh" aria-label="Reload the latest picks">↻</button>
    <button class="btn icon" id="theme" aria-label="Switch light or dark">◐</button>
  </div>
</header>
<main id="main" tabindex="-1"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Pick details">
  <div class="drawer-inner">
    <button class="btn icon close" id="drawer-close" aria-label="Close details">✕</button>
    <div id="drawer-body"></div>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<nav class="bottom-tabs" aria-label="Main views">
  <a href="#tonight" data-view="tonight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5v17M6 6c2.6 2.2 2.6 9.8 0 12M18 6c-2.6 2.2-2.6 9.8 0 12"/></svg>Tonight</a>
  <a href="#games" data-view="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.6"/></svg>Games</a>
  <a href="#record" data-view="record"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 21h16"/></svg>Record</a>
  <a href="#players" data-view="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.5 7-5.5s5.8 1.9 7 5.5"/></svg>Players</a>
  <a href="#more" data-view="more"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg>More</a>
</nav>
<footer class="foot">
  <span>Paper picks for research. Not betting advice. Check every line and price before you place anything.</span>
  <span id="foot-run"></span>
</footer>
<script id="embedded" type="application/json"></script>
<script src="app.js"></script>
</body>
</html>
